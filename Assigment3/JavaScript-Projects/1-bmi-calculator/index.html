<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-card">
        <span class="badge">Health Metric</span>
        <h1>BMI Calculator</h1>
        <p class="subtitle">Compute your Body Mass Index quickly</p>

        <form id="bmi-form">
            <div class="input-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 175" step="0.1" required>
            </div>

            <div class="input-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 70" step="0.1" required>
            </div>

            <button type="submit" class="btn-calculate">Calculate BMI</button>
        </form>

        <div id="result" class="result-box">Enter your height and weight above to see your BMI score.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
