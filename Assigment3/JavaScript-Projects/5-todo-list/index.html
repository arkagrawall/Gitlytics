<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager — To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-card">
        <span class="badge">DOM Manipulation & Arrays</span>
        <h1>Developer Task Manager</h1>
        <p class="subtitle">Organize and track your daily coding goals</p>

        <form id="todo-form">
            <input type="text" id="task-input" placeholder="What needs to be done?" required>
            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <ul id="task-list" class="task-list"></ul>

        <div class="todo-stats">
            <span id="task-count">0 tasks total</span>
            <button id="clear-all" class="btn-clear">Clear Completed</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
