<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-badge">Student Portal</div>
            <h2>Account Login</h2>
            <p class="login-subtitle">Enter your credentials to access your dashboard</p>

            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Login Demo Submitted');">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <div class="login-footer">
                <span>Don't have an account? <a href="registration.html">Register here</a></span>
            </div>
        </div>
    </div>
</body>
</html>
